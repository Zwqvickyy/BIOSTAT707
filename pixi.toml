 [workspace]
name = "biostat707-checkpoint1"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
pandas = "*"
numpy = "*"
matplotlib = "*"
seaborn = "*"
missingno = "*"
tableone = "*"

[tasks]
checkpoint1 = "python checkpoint1.py"

[feature.cp2.tasks]
checkpoint2 = { cmd = "python checkpoint2.py", default-environment = "cp2" }

[feature.cp2.dependencies]
python = "3.12.*"
pandas = ">=3.1.0,<4"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
scikit-learn = ">=1.9.1,<2"
scipy = ">=1.18.1,<2"
joblib = ">=1.6.0,<2"
reportlab = ">=5.0.1,<6"
pypdf = ">=6.21.2,<7"

[environments]
cp2 = { features = ["cp2"], no-default-feature = true }
